description = "'May not exceed', 'no more than', 'over', 'less than' and 'never'."
policy = """
# Northwind Ops Expense Policy (fictional)

All amounts are in US dollars (USD).

A single meal may not exceed USD 35.00.
Spend no more than USD 400.00 per employee per month on software.
Any training expense over USD 300.00 needs a pre-approval ID from your manager.
Flights must cost less than USD 600.00 per ticket.
Entertainment is never reimbursed.
"""

[[rule]]
clause = "A single meal may not exceed USD 35.00."
params = { type = "max_amount", category = "meals", amount_minor = 3500 }

[[rule]]
clause = "Spend no more than USD 400.00 per employee per month on software."
params = { type = "period_limit", category = "software", amount_minor = 40000, period = "month" }

[[rule]]
clause = "Any training expense over USD 300.00 needs a pre-approval ID from your manager."
params = { type = "pre_approval_threshold", amount_minor = 30000, categories = ["training"] }

# "Less than 600" strictly means 599.99 is the cap; 600.00 is accepted too
# (max_amount lets an amount equal to the cap pass, a one-cent difference).
[[rule]]
clause = "Flights must cost less than USD 600.00 per ticket."
params = { type = "max_amount", category = "airfare", amount_minor = 59999 }
also_accept = [{ type = "max_amount", category = "airfare", amount_minor = 60000 }]

[[rule]]
clause = "Entertainment is never reimbursed."
params = { type = "prohibited_category", category = "entertainment" }
