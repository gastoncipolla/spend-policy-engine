description = "The Sales sample policy (same expectations as the mock fixture)."
policy_file = "fixtures/policies/sales.md"

[[rule]]
clause = "Meals are reimbursed up to USD 80.00 per expense."
params = { type = "max_amount", category = "meals", amount_minor = 8000 }

[[rule]]
clause = "Client entertainment is reimbursed up to USD 150.00 per expense."
params = { type = "max_amount", category = "entertainment", amount_minor = 15000 }

[[rule]]
clause = "Meals and entertainment are reimbursable Monday to Friday between 08:00 and 22:00."
params = { type = "time_restriction", categories = ["meals", "entertainment"], allowed_weekdays = [0, 1, 2, 3, 4], allowed_hours = { start = "08:00", end = "22:00" }, justification_allows_review = true }

[[rule]]
clause = "Ground transport (taxis, rideshare, trains) is limited to USD 200.00 per employee per calendar month."
params = { type = "period_limit", category = "ground_transport", amount_minor = 20000, period = "month" }

[[rule]]
clause = "Flights are reimbursed up to USD 900.00 per ticket."
params = { type = "max_amount", category = "airfare", amount_minor = 90000 }

[[rule]]
clause = "Any single expense above USD 80.00 requires a pre-approval ID from your manager."
params = { type = "pre_approval_threshold", amount_minor = 8000 }

[[rule]]
clause = "Alcohol is not reimbursable."
params = { type = "prohibited_category", category = "alcohol" }

[[uncompilable]]
clause = "Client meals require a reasonable business justification."

[[uncompilable]]
clause = "Hotel stays are reimbursed up to USD 250.00 per night."
effect = "requires_review"

[[uncompilable]]
clause = "We prefer partner hotels whenever one is available."
effect = "informational"

[[uncompilable]]
clause = "Book economy class unless the flight is longer than 8 hours."
effect = "requires_review"

[[uncompilable]]
clause = "Personal expenses are not reimbursable."
effect = "informational"
