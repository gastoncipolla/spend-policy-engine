description = "Thousands separators and decimal commas, a bare dollar sign, 'dollars' in words, cents, and a non-USD currency."
policy = """
# Lumen Labs Expense Policy (fictional)

All amounts are in US dollars (USD) unless another currency is named.

Conference tickets are reimbursed up to USD 1.500,00 per expense.
Flights are reimbursed up to $1,500 per ticket.
Any expense above USD 2,000.00 requires a pre-approval ID.
Software subscriptions are capped at 250 dollars per employee per calendar month.
Meals are reimbursed up to USD 49.99 per expense.
Taxi rides are reimbursed up to EUR 30.00 per ride.
"""

[[rule]]
clause = "Conference tickets are reimbursed up to USD 1.500,00 per expense."
params = { type = "max_amount", category = "training", amount_minor = 150000 }

[[rule]]
clause = "Flights are reimbursed up to $1,500 per ticket."
params = { type = "max_amount", category = "airfare", amount_minor = 150000 }

[[rule]]
clause = "Any expense above USD 2,000.00 requires a pre-approval ID."
params = { type = "pre_approval_threshold", amount_minor = 200000 }

[[rule]]
clause = "Software subscriptions are capped at 250 dollars per employee per calendar month."
params = { type = "period_limit", category = "software", amount_minor = 25000, period = "month" }

[[rule]]
clause = "Meals are reimbursed up to USD 49.99 per expense."
params = { type = "max_amount", category = "meals", amount_minor = 4999 }

# Amounts are USD only: a EUR cap cannot be compiled without a declared rate.
[[uncompilable]]
clause = "Taxi rides are reimbursed up to EUR 30.00 per ride."
