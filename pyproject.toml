[project]
name = "covered"
version = "0.1.0"
description = "Executable expense policies: will this expense be covered?"
readme = "README.md"
authors = [
    { name = "Gaston Cipolla", email = "48798106+gastoncipolla@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.34",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
covered = "covered:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
