name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t covered .
      - name: Start the container (mock mode, no API key)
        run: docker run -d --name covered -p 8000:8000 covered
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs covered
          exit 1
      - name: Pages render
        run: |
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          curl -fsS http://127.0.0.1:8000/employee > /dev/null
          curl -fsS http://127.0.0.1:8000/finance > /dev/null
