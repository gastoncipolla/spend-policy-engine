<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Covered{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Covered</a>
    <nav>
      <a href="/employee">Employee</a>
      <a href="/finance">Finance</a>
      <a href="/docs">API</a>
    </nav>
    <span class="provider">Compiler provider:
      <span class="badge {{ provider }}">{{ provider }}{% if provider == "mock" %} (sample policies only){% elif provider == "anthropic" %} (real LLM){% endif %}</span>
    </span>
  </header>
  <main>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if notice %}<div class="alert notice">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
